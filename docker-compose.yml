services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careertwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careertwin}
      POSTGRES_DB: ${POSTGRES_DB:-careertwin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - careertwin_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careertwin_postgres:
